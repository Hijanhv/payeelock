specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: PayeeLock
    network: sepolia
    source:
      address: '0x1590ee40de98affa90d748e8b5eab6fc5a8ddeb6'
      abi: PayeeLock
      startBlock: 11685128
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Supplier
        - Invoice
        - PayeeLockEvent
      abis:
        - name: PayeeLock
          file: ./abis/PayeeLock.json
      eventHandlers:
        - event: SupplierRegistered(indexed bytes32,indexed bytes32,address,address,address)
          handler: handleSupplierRegistered
        - event: InvoiceApproved(indexed bytes32,indexed bytes32,uint256,address,uint64)
          handler: handleInvoiceApproved
        - event: SupplierFrozen(indexed bytes32,uint64)
          handler: handleSupplierFrozen
        - event: InvoiceMigrated(indexed bytes32,uint64,uint64,address,uint256)
          handler: handleInvoiceMigrated
        - event: RecoveryActivated(indexed bytes32,uint64,address)
          handler: handleRecoveryActivated
        - event: InvoicePaid(indexed bytes32,indexed address,uint256,uint256,uint64)
          handler: handleInvoicePaid
        - event: InvoiceCancelled(indexed bytes32,uint256)
          handler: handleInvoiceCancelled
        - event: ExecutorChanged(indexed address)
          handler: handleExecutorChanged
        - event: GuardianChanged(indexed address)
          handler: handleGuardianChanged
      file: ./src/payeelock.ts
  - kind: ethereum/contract
    name: PermissionedResolver
    network: sepolia
    source:
      address: '0x2368D210C506de631780863062C48c75695e06F9'
      abi: PermissionedResolver
      startBlock: 11685099
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - EnsActivity
      abis:
        - name: PermissionedResolver
          file: ./abis/PermissionedResolver.json
      eventHandlers:
        - event: AddrChanged(indexed bytes32,address)
          handler: handleAddrChanged
        - event: AddressChanged(indexed bytes32,uint256,bytes)
          handler: handleAddressChanged
        - event: EACRolesChanged(indexed uint256,indexed address,uint256,uint256)
          handler: handleRolesChanged
        - event: TextChanged(indexed bytes32,indexed string,string,string)
          handler: handleTextChanged
      file: ./src/resolver.ts
